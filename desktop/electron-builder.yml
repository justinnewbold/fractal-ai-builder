# Packaging for the Mac app.
#
# The web app is built by the root project and copied in as an extra resource
# rather than being part of this package — main.js finds it at
# `process.resourcesPath/dist`, which is what makes ForgeFX able to serve it.
appId: cloud.newbold.fractal
productName: Fractal Remote
directories:
  output: release
# An allowlist, not a filter. Anything main.js reaches for at runtime has to be
# named here or it simply is not in the app.
#
# preload.js was missing from this list for every release it existed in. It is
# loaded by absolute path (main.js: join(__dirname, 'preload.js')), and Electron
# treats a preload that is not there as no preload at all — no error, no warning
# in the window, nothing. So `window.fractalDesktop` was never defined in a
# packaged build, `desktopBridge()` answered null exactly as it is designed to
# on a phone or the hosted site, and the whole Updates section — the version
# line, "Check for updates", the "an update is ready" notice — rendered nothing
# and looked like a feature that had never been written.
#
# It worked perfectly in development, where the file is on disk beside main.js.
# That is the shape of this bug: only the packaged app is missing it, and the
# packaged app is the only one anybody runs.
files:
  - main.js
  - preload.js
  - lib/**
  - trayTemplate*.png
  # Windows gets the artwork rather than a template image; see buildTray.
  - trayWin.png
  - package.json
# The server's watchdog is run by the Electron binary as a plain Node script,
# which needs a real path rather than one inside the archive. See main.js.
asarUnpack:
  - lib/child.cjs
extraResources:
  - from: ../dist
    to: dist
  # ForgeFX and its codec, pinned and built by scripts/vendor-forgefx.mjs. They
  # travel together because the server depends on the codec by relative path,
  # and they sit outside the asar so their native modules load normally.
  - from: vendor
    to: vendor
# Runs on the packaged .app before the disk image is built. Ad-hoc signs when
# there is no certificate, because Apple Silicon refuses to run a binary with
# no signature at all and calls it "damaged".
afterPack: afterPack.js

# Where a new version comes from, and where a release build puts one.
#
# The same block answers both questions, which is the point: electron-updater
# reads this out of the packaged app to know where to look, and electron-builder
# writes latest-mac.yml beside the disk images when a tag build publishes. If
# they could disagree the app would check somewhere nothing is ever released.
publish:
  provider: github
  owner: justinnewbold
  repo: fractal-ai-builder
  # Published, not drafted.
  #
  # electron-builder's own default here is `draft`, and a draft release is
  # invisible to everything except a person logged into this repository — so
  # the app would check for updates, find nothing, and be right, while a
  # perfectly good release sat there waiting for a click nobody knew to make.
  # The same shape of failure as building only a .dmg: it looks like it works.
  #
  # Note that the release this creates is tagged `v<version>` by
  # electron-builder, which is not the `desktop-v<version>` tag that triggers
  # the build. Two tags, one job each: one says "release this", the other is
  # the release. The app only ever reads the latter.
  releaseType: release

mac:
  category: public.app-category.music
  # A PNG, not an .icns: electron-builder converts it with its own bundled
  # tool, so the icon stays generated from public/icon.svg (npm run icon) and
  # nothing here needs a Mac to produce it.
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    # A zip as well as the image, and not for people to download.
    #
    # electron-updater cannot update from a .dmg: it downloads the new version
    # in the background and swaps it in, and mounting a disk image is not
    # something it can do unattended. The zip is what it actually fetches, and
    # latest-mac.yml points at it. Without this the app checks, finds a release,
    # and can never install it.
    - target: zip
      arch: [arm64, x64]
  # Signing and notarisation are switched on by the presence of a certificate.
  # Without one this still builds; macOS then shows "unidentified developer"
  # and the first launch needs right-click → Open.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
# No `dmg.title` on purpose. That string is the volume name the disk image
# mounts under, and it was set to a constant — so both architectures asked for
# /Volumes/Fractal AI Builder at the same time, and the second build spent six
# retries failing to detach a volume the first one was still using before it
# killed the job. electron-builder's own default is "<product> <version>" plus
# an arch suffix, which is exactly the uniqueness this needs, so the fix is to
# stop overriding it rather than to invent a new name.

# ---------------------------------------------------------------- windows
#
# The same app, the same Electron, a different installer. Everything above
# this — the server it carries, the allowlist, the update channel — is shared,
# which is the whole reason the Windows app is a target rather than a project.
#
# WHAT IS NOT SHARED, and it is worth being plain about it:
#
#   The tray icon. macOS wants a template image and inverts it; Windows wants
#   the artwork. Two files, one drawing. See buildTray in main.js.
#
#   Code signing. macOS signs from MAC_CERT_P12; Windows wants its own
#   certificate and this build has none. An unsigned installer RUNS, and
#   SmartScreen shows "Windows protected your PC" with a More info → Run
#   Anyway behind it. That is a real cost to a person downloading it, and it
#   is a cost that only money removes: a code-signing certificate is bought,
#   not generated. The job below signs when WIN_CERT_P12 exists and builds
#   without it otherwise, so the day one is bought nothing here changes.
#
#   The device layer does not differ. serialport and @julusian/midi are the
#   same N-API modules on both, and ForgeFX opens a named port rather than a
#   /dev path — see desktop/README.md. What Windows adds is the firewall
#   prompt on first run, which is a thing the person says yes to rather than a
#   thing this app can do anything about.
win:
  icon: build/icon.png
  target:
    # NSIS is the installer; the zip is what electron-updater actually
    # downloads, exactly as on macOS. Without it the app checks, finds a
    # release, and can never install it.
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

nsis:
  # One click, no directory page, per user. It installs without an
  # administrator, which is the difference between "I'll do it later" and
  # done — and this app needs no machine-wide anything.
  oneClick: true
  perMachine: false
  # It is a service you leave running: starting it after the install is what
  # somebody expects, and it goes to the tray rather than opening a window.
  runAfterFinish: true
  # Removing it should remove it. The app keeps nothing a person would miss
  # that is not in their account.
  deleteAppDataOnUninstall: false

# ------------------------------------------------------------------ linux
#
# Added because the honest answer to "what does a Linux user do?" was, until
# now, nothing. The one-paste installer looked like the answer and is not: it
# clones three repositories, two of which are private, so a stranger gets as
# far as the first `git fetch` and stops. The apps are the route that works
# without a token, and Linux did not have one.
#
# APPIMAGE FIRST because it is the format with no install step: download,
# make it executable, run it. It works on every distribution rather than
# asking which one somebody has, and — the part that matters here —
# electron-updater only knows how to update AppImage on Linux. A .deb cannot
# update itself, which is why AppImage is the one the update feed points at.
#
# The .deb is there for the machine this is most likely to end up on. A box
# that sits in a rack with a USB cable in it and stays on is Debian or Ubuntu
# or Raspberry Pi OS nine times in ten, and on those `apt install ./file.deb`
# is the thing a person already knows how to do.
#
# NO ARCH LIST HERE, deliberately, and it is the whole reason there are two
# jobs rather than one. serialport and @julusian/midi are compiled, and they
# are compiled for the machine that ran `npm ci` — so an x64 runner
# cross-building an arm64 package produces an installer whose device layer
# cannot load. Each job builds for its own architecture and says nothing about
# the other. That is also what makes a Raspberry Pi build real rather than
# theoretical.
linux:
  icon: build/icon.png
  category: AudioVideo
  # What the desktop entry says it is, for a menu that groups by it.
  synopsis: Run your Fractal rig from your phone
  description: >-
    Serves the Fractal Remote app from this machine and talks to a Fractal
    Audio unit over USB, so a phone on the same wifi can drive the rig.
  target:
    - AppImage
    - deb

deb:
  # The two the device layer actually needs. udev is what gives a non-root
  # user access to the USB serial device, and libasound is what the MIDI
  # backend links against — a package that installs and then cannot see the
  # unit is the failure this prevents.
  depends:
    - libudev1
    - libasound2
