# Build the desktop apps.
#
# TWO JOBS, ONE APP. macOS binaries need a macOS runner and Windows ones need a
# Windows runner — the app carries native modules (serial, MIDI) that are
# compiled per platform, so neither can be cross-built from the other.
#
# Everything above the runner is shared: the same main.js, the same vendored
# device server at the same pinned commit, the same update channel. What
# differs is the installer, the tray icon and the certificate. See the `win`
# block in desktop/electron-builder.yml for the whole of it.
#
# The device server is no longer checked out beside the app and then thrown
# away — scripts/vendor-forgefx.mjs fetches it at the pinned commit and builds
# it into desktop/vendor, which electron-builder copies into the bundle. That
# is the difference between a .dmg that works on the machine that built it and
# one that works on someone else's.
#
# Signing and notarisation happen whenever there is a certificate to sign with
# and the run is not a pull request. Those are the two real constraints, and it
# is worth saying why the second one is not "only on a release tag":
# electron-builder refuses to sign PR builds by design, because a pull request
# from a fork would otherwise get at the certificate. Everything else — a tag, a
# push, a hand-started run — can sign, and should, because an artefact someone
# installs is worth signing whether or not it was called a release.
#
# Without the secrets this still builds, and macOS then reports an unidentified
# developer on first launch.
name: desktop

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release from this build'
        type: boolean
        default: false
  push:
    tags: ['desktop-v*']
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/vendor-forgefx.mjs'
      - '.github/workflows/desktop.yml'

jobs:
  mac:
    # Pinned, and this is a stopgap rather than a fix.
    #
    # GitHub rolled macos-latest from image 20260728.0273.1 to 20260831.0337.3
    # between two builds three hours apart. The first signed and published
    # 7.31.0; the next two failed identically inside electron-builder's
    # keychain step:
    #
    #   security: SecKeychainUnlock: The user name or passphrase you entered
    #   is not correct.
    #
    # No secret changed and no code in the signing path changed — the machine
    # underneath did. Pinning puts releases back on a machine known to work
    # while electron-builder is brought up to a version that handles the new
    # image; the real fix is that upgrade, and this line goes when it lands.
    runs-on: macos-15
    # Creating a release needs contents: write, and a workflow that says
    # nothing gets whatever the repository defaults to — which here is read
    # only. GitHub named the missing permission itself when it refused:
    #
    #   403 Resource not accessible by integration
    #   x-accepted-github-permissions: contents=write
    #
    # Asked for by name rather than left to a default, so this cannot quietly
    # change underneath the release again. Nothing else is granted: the job
    # reads the repository, builds it, and publishes what it built.
    permissions:
      contents: write
    env:
      # Whether a certificate exists at all. The `secrets` context cannot be
      # read from a step's `if`, but `env` can, so the question is answered once
      # here and asked by name below.
      SIGNABLE: ${{ secrets.MAC_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: The web app, and the logic the launchers share
        run: |
          npm ci
          npm test
          npm run build

      # Pinned by desktop/forgefx.lock.json: a tag to read, a commit to fetch.
      # FORGEFX_TOKEN is required — the mirrors it reads are private. Without it
      # the script stops and says so by name rather than failing on git's own
      # "could not read Username", which sends people looking anywhere but here.
      - name: Vendor the device server
        env:
          FORGEFX_TOKEN: ${{ secrets.FORGEFX_TOKEN }}
        run: npm run vendor:forgefx

      - name: Install the shell
        working-directory: desktop
        run: npm install

      # The question this answers cannot be answered anywhere but here: the
      # server's native modules are built against system Node, and the app runs
      # them under Electron-as-Node, whose ABI differs. N-API modules do not
      # care; anything else does, and the symptom would be an app that opens
      # perfectly and never sees the unit. Better a red build than that.
      - name: The native modules load under Electron
        working-directory: desktop/vendor/forgefx/server
        run: |
          ELECTRON="$(cd "$GITHUB_WORKSPACE/desktop" && node -p 'require("electron")')"
          echo "electron: $ELECTRON"
          ELECTRON_RUN_AS_NODE=1 "$ELECTRON" -e "
            require('serialport');
            require('@julusian/midi');
            console.log('serial and MIDI both load under Electron-as-Node');
          "

      # Two steps rather than one, and the reason is worth writing down.
      #
      # electron-builder decides whether to sign from whether CSC_LINK is
      # *defined*: `getCscLink` is commented "allow to specify as empty string",
      # and the gate is `cscLink == null`. GitHub turns a secret that does not
      # exist into an empty string — which is not null — so naming the secret in
      # `env:` says "sign, with this empty certificate", and the build dies with
      # "<dir> not a file". A pull request hides it, because electron-builder
      # refuses to sign PR builds at all; every other trigger hits it.
      #
      # An `env:` block cannot leave a variable unset, so the choice has to be
      # which step runs.
      - name: Package
        if: ${{ github.event_name == 'pull_request' || env.SIGNABLE != 'true' }}
        working-directory: desktop
        env:
          # Nothing to sign with, and say so rather than letting it look.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Package, signed and notarised
        if: ${{ github.event_name != 'pull_request' && env.SIGNABLE == 'true' }}
        working-directory: desktop
        env:
          # Published only from a release tag. Every other run builds the same
          # artefact and keeps it, so a dispatch can prove the signing chain
          # without putting a version on the update feed that nobody asked for.
          # Two ways to say "release this", and one of them is a button.
          #
          # A tag was the only way, and pushing one is not always available —
          # a credential scoped to a branch is refused with a 403, and there is
          # nothing to retry. It was never required either: electron-builder
          # creates the release through GitHub's API and GitHub makes the tag,
          # so the tag is a *result* of releasing rather than the trigger for
          # it. The run that publishes is the record of what was released.
          #
          # Only ever from the default branch. `createRelease` does not send a
          # commit to tag, so GitHub tags the default branch's head — a release
          # published from anywhere else would carry that name and someone
          # else's code.
          PUBLISH: >-
            ${{ (startsWith(github.ref, 'refs/tags/desktop-v')
                 || (inputs.publish && github.ref == 'refs/heads/main'))
                && 'always' || 'never' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist

      # electron-builder notarises the app and stops there. Its
      # `notarizeIfProvided` takes the app path, and it runs during signing —
      # before a disk image exists at all. So the .dmg a person actually
      # downloads carried no ticket of its own, which is exactly what the step
      # below caught the first time it got far enough to ask:
      # "does not have a ticket stapled to it".
      #
      # That matters because the image is the first thing macOS assesses. It
      # quarantines the download and checks the container before anything
      # inside it is reachable, and a stapled ticket is what lets that succeed
      # with no network.
      #
      # Deliberately not signed. electron-builder offers `dmg.sign` and
      # documents it as "Signing is not required and will lead to unwanted
      # errors in combination with notarization requirements" — the notary
      # service reads what is inside the image, and the ticket attaches either
      # way. Taking the tool's own word over a guess.
      - name: Notarise the disk image too
        if: ${{ github.event_name != 'pull_request' && env.SIGNABLE == 'true' }}
        working-directory: desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dmg in release/*.dmg; do
            echo "── $dmg"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$dmg"
          done

      # What the steps above claim, checked against what macOS will actually do
      # with the file. Three different questions, and a build can pass one while
      # failing another:
      #
      #   codesign --verify   is the signature intact, and does it cover
      #                       everything inside — the vendored server's native
      #                       modules included
      #   spctl --assess      would Gatekeeper let a person open this
      #   stapler validate    did notarisation actually happen, and is the
      #                       ticket attached so it works with no network
      #
      # The last one is why this step exists rather than a comment guessing at
      # whether electron-builder notarises on the strength of credentials alone.
      # If it does not, this goes red and names the missing piece, which beats
      # shipping a .dmg that Gatekeeper quarantines on someone else's Mac.
      - name: Prove the artefact is what it claims
        if: ${{ github.event_name != 'pull_request' && env.SIGNABLE == 'true' }}
        working-directory: desktop
        run: |
          set -euo pipefail
          # Globs rather than `find | for`: the product name has spaces in it.
          shopt -s nullglob

          seen=0
          for app in release/mac*/*.app; do
            seen=1
            echo "── $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type exec --verbose=4 "$app"
            xcrun stapler validate "$app"
          done
          [ "$seen" = 1 ] || { echo "no .app was produced to check"; exit 1; }

          # The disk image gets one question, not the app's three. `codesign
          # --verify` was asked of it once and cannot ever pass: a .dmg is a
          # disk image, not a code object, and the first build to reach this
          # said so — "code object is not signed at all" — while the app inside
          # it had already come back "accepted, source=Notarized Developer ID".
          #
          # What matters for a file someone downloads is the stapled ticket:
          # macOS quarantines the download and checks the image itself before
          # anything inside it is reachable, and a stapled ticket is what makes
          # that work with no network.
          seen=0
          for dmg in release/*.dmg; do
            seen=1
            echo "── $dmg"
            xcrun stapler validate "$dmg"
          done
          [ "$seen" = 1 ] || { echo "no .dmg was produced to check"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: fractal-ai-builder-mac
          path: desktop/release/*.dmg
          if-no-files-found: error

  # ------------------------------------------------------------------ windows
  #
  # The same app on a Windows runner. It cannot be built on the Mac one: the
  # device server's native modules are compiled for the platform they run on,
  # which is the whole reason there are two jobs rather than two targets in one.
  #
  # UNSIGNED UNLESS THERE IS A CERTIFICATE, and the difference is visible to
  # whoever downloads it. An unsigned installer runs, and SmartScreen puts
  # "Windows protected your PC" in front of it with a More info → Run anyway
  # behind that. Nothing here can remove that warning: a Windows code-signing
  # certificate is bought rather than generated. WIN_CERT_P12 and
  # WIN_CERT_PASSWORD are read the moment they exist, and nothing else changes.
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      SIGNABLE: ${{ secrets.WIN_CERT_P12 != '' }}
    # bash on the Windows runner, for every step that runs a command: the
    # heredoc below, the loops over release/, and `${PUBLISH:-never}` in the
    # Package steps.
    #
    # THAT LAST ONE USED TO LIVE IN THE DIST SCRIPT, and this is the shape of
    # the bug it caused, because it is not the one it looks like. `shell: bash`
    # governs the step's own command and nothing further: npm runs a script's
    # BODY through its own shell, which on Windows is cmd.exe whatever the
    # workflow asked for. So `--publish ${PUBLISH:-never}` inside the script
    # reached electron-builder verbatim and it failed with
    #   Argument: publish, Given: "${PUBLISH:-never}"
    # — a message that names the right argument and gives no hint that a shell
    # is involved at all.
    #
    # dist:win carries no shell syntax now. The expansion happens here, where
    # bash is real, and npm is handed a word.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: The web app, and the logic the launchers share
        run: |
          npm ci
          npm test
          npm run build

      - name: Vendor the device server
        env:
          FORGEFX_TOKEN: ${{ secrets.FORGEFX_TOKEN }}
        run: npm run vendor:forgefx

      - name: Install the shell
        working-directory: desktop
        run: npm install

      # The same question the Mac job asks, and it is worth asking twice: the
      # modules are built against the runner's Node and loaded under Electron's,
      # whose ABI differs. N-API modules do not care; anything else does, and
      # the symptom would be an app that opens perfectly and never sees the
      # unit.
      - name: The native modules load under Electron
        working-directory: desktop/vendor/forgefx/server
        run: |
          ELECTRON="$(cd "$GITHUB_WORKSPACE/desktop" && node -p 'require("electron")')"
          echo "electron: $ELECTRON"
          ELECTRON_RUN_AS_NODE=1 "$ELECTRON" -e "
            require('serialport');
            require('@julusian/midi');
            console.log('serial and MIDI both load under Electron-as-Node');
          "

      # UNSIGNED WINDOWS BUILDS STILL PUBLISH, and that is the one place this
      # job deliberately differs from the Mac one above.
      #
      # An unsigned macOS app is not worth releasing: Gatekeeper refuses it
      # outright and the person who downloaded it has no way through that a
      # normal person would find. Windows is not like that. SmartScreen shows
      # a blue "Windows protected your PC" box with More info -> Run anyway
      # underneath it, and the installer then works exactly as a signed one
      # would. Holding the Windows release back until a certificate exists
      # would mean no Windows app at all, for a warning the connect screen
      # already tells people to expect.
      #
      # A certificate is still worth buying — it is the difference between
      # "Run anyway" and no box at all — but it is not what stands between a
      # PC and this app.
      - name: Package
        if: ${{ github.event_name == 'pull_request' || env.SIGNABLE != 'true' }}
        working-directory: desktop
        env:
          PUBLISH: >-
            ${{ (github.event_name != 'pull_request'
                 && (startsWith(github.ref, 'refs/tags/desktop-v')
                     || (inputs.publish && github.ref == 'refs/heads/main')))
                && 'always' || 'never' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win -- --publish "${PUBLISH:-never}"

      - name: Package, signed
        if: ${{ github.event_name != 'pull_request' && env.SIGNABLE == 'true' }}
        working-directory: desktop
        env:
          PUBLISH: >-
            ${{ (startsWith(github.ref, 'refs/tags/desktop-v')
                 || (inputs.publish && github.ref == 'refs/heads/main'))
                && 'always' || 'never' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: npm run dist:win -- --publish "${PUBLISH:-never}"

      # An installer and the zip beside it. The zip is not for people: it is
      # what electron-updater downloads, exactly as on macOS, and without it
      # the app finds a release it can never install.
      - name: Both halves of a release are there
        working-directory: desktop
        run: |
          ls -la release/
          seen=0
          for exe in release/*.exe; do [ -e "$exe" ] && seen=1; done
          [ "$seen" = 1 ] || { echo "no installer was produced"; exit 1; }
          seen=0
          for z in release/*.zip; do [ -e "$z" ] && seen=1; done
          [ "$seen" = 1 ] || { echo "no zip was produced, so nothing can update itself"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: fractal-ai-builder-windows
          path: desktop/release/*.exe
          if-no-files-found: error

  # ----------------------------------------------------------------- linux
  #
  # TWO ARCHITECTURES, EACH BUILT ON ITS OWN, which is the one decision in
  # this job that is not cosmetic. serialport and @julusian/midi are compiled
  # against the machine that installs them, so an x64 runner cross-building an
  # arm64 package produces an installer whose device layer cannot load — it
  # installs perfectly and never sees the unit. Each runner builds for itself
  # and claims nothing about the other.
  #
  # The arm64 half is what makes a Raspberry Pi a real answer rather than a
  # suggestion: a Pi in a rack with a USB cable in it, left on, is the closest
  # thing to a purpose-built box this project has. `ubuntu-24.04-arm` runners
  # are free on a public repository, which this one is.
  #
  # UNSIGNED, AND THAT IS NORMAL HERE. Linux has no Gatekeeper and no
  # SmartScreen; an AppImage is made executable and run. There is nothing to
  # buy and nothing to warn anybody about, so unlike the other two platforms
  # this job has no signed variant at all.
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: The web app, and the logic the launchers share
        run: |
          npm ci
          npm test
          npm run build

      - name: Vendor the device server
        env:
          FORGEFX_TOKEN: ${{ secrets.FORGEFX_TOKEN }}
        run: npm run vendor:forgefx

      - name: Install the shell
        working-directory: desktop
        run: npm install

      # The same question the other two jobs ask, and on this one it carries
      # the extra weight of proving the arm64 half is real: a module built for
      # the wrong architecture fails here rather than on somebody's Pi.
      - name: The native modules load under Electron
        working-directory: desktop/vendor/forgefx/server
        run: |
          ELECTRON="$(cd "$GITHUB_WORKSPACE/desktop" && node -p 'require("electron")')"
          echo "electron: $ELECTRON  arch: $(uname -m)"
          ELECTRON_RUN_AS_NODE=1 "$ELECTRON" -e "
            require('serialport');
            require('@julusian/midi');
            console.log('serial and MIDI both load under Electron-as-Node');
          "

      # ON ARM ONLY, AND THE REASON IS A BINARY THAT DOES NOT EXIST.
      #
      # electron-builder does not build a .deb itself — it downloads fpm and
      # shells out to it. The copy it downloads is `fpm-1.9.3-2.3.1-linux-x86`,
      # and that is the only one published: there is no arm64 build of it. So
      # on this runner the AppImage finishes perfectly, the .deb starts, and
      # the Ruby inside that bundle dies with
      #
      #   cannot execute binary file: Exec format error
      #
      # which reads like a corrupt download and is in fact a 32-bit x86
      # interpreter being handed to an arm64 kernel.
      #
      # fpm is a Ruby gem, and a gem is architecture-neutral. Installing it
      # and setting USE_SYSTEM_FPM makes app-builder run `fpm` off PATH and
      # download nothing — verified by running app-builder that way against an
      # empty cache and watching a valid .deb come out with no fetch.
      #
      # The x64 job deliberately does NOT do this. Its bundled fpm works, and
      # a gem install it does not need is one more thing between that build
      # and a release.
      #
      # WHICH IS WHY THE FLAG IS EXPORTED HERE RATHER THAN SET ON `Package`
      # WITH A CONDITIONAL VALUE. app-builder tests whether USE_SYSTEM_FPM is
      # PRESENT, not what it says, so `USE_SYSTEM_FPM: ${{ ... || '' }}` —
      # which is the obvious way to write "arm only" — hands x64 an empty
      # string that still means yes, and that job then looks for an fpm nobody
      # installed. Tested: with the variable set to empty and fpm off PATH,
      # app-builder skips its own copy and fails with "executable file not
      # found in $PATH". Exporting it from this step means the variable simply
      # does not exist on x64, and the install and the switch stay in one
      # place where they cannot disagree.
      - name: A packager that runs on this machine
        if: matrix.arch == 'arm64'
        run: |
          if ! command -v ruby >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ruby ruby-dev build-essential
          fi
          sudo gem install --no-document fpm
          fpm --version
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"

      - name: Package
        working-directory: desktop
        env:
          PUBLISH: >-
            ${{ (github.event_name != 'pull_request'
                 && (startsWith(github.ref, 'refs/tags/desktop-v')
                     || (inputs.publish && github.ref == 'refs/heads/main')))
                && 'always' || 'never' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:linux -- --publish "${PUBLISH:-never}"

      # The AppImage is the one that can update itself, so a release without
      # one leaves every installed copy stranded. The .deb is the one people
      # on a Pi or a Debian box will actually reach for. Both or neither.
      - name: Both halves of a release are there
        working-directory: desktop
        run: |
          ls -la release/
          seen=0
          for f in release/*.AppImage; do [ -e "$f" ] && seen=1; done
          [ "$seen" = 1 ] || { echo "no AppImage was produced, so nothing can update itself"; exit 1; }
          seen=0
          for f in release/*.deb; do [ -e "$f" ] && seen=1; done
          [ "$seen" = 1 ] || { echo "no .deb was produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: fractal-ai-builder-linux-${{ matrix.arch }}
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error
