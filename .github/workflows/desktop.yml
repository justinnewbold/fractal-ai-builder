# Build the Mac app.
#
# This is the only place it can be built. macOS binaries need a macOS runner,
# and the app carries native modules (serial, MIDI) that are compiled per
# platform.
#
# The device server is no longer checked out beside the app and then thrown
# away — scripts/vendor-forgefx.mjs fetches it at the pinned commit and builds
# it into desktop/vendor, which electron-builder copies into the bundle. That
# is the difference between a .dmg that works on the machine that built it and
# one that works on someone else's.
#
# Signing and notarisation happen whenever there is a certificate to sign with
# and the run is not a pull request. Those are the two real constraints, and it
# is worth saying why the second one is not "only on a release tag":
# electron-builder refuses to sign PR builds by design, because a pull request
# from a fork would otherwise get at the certificate. Everything else — a tag, a
# push, a hand-started run — can sign, and should, because an artefact someone
# installs is worth signing whether or not it was called a release.
#
# Without the secrets this still builds, and macOS then reports an unidentified
# developer on first launch.
name: desktop

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release from this build'
        type: boolean
        default: false
  push:
    tags: ['desktop-v*']
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/vendor-forgefx.mjs'
      - '.github/workflows/desktop.yml'

jobs:
  mac:
    runs-on: macos-latest
    # Creating a release needs contents: write, and a workflow that says
    # nothing gets whatever the repository defaults to — which here is read
    # only. GitHub named the missing permission itself when it refused:
    #
    #   403 Resource not accessible by integration
    #   x-accepted-github-permissions: contents=write
    #
    # Asked for by name rather than left to a default, so this cannot quietly
    # change underneath the release again. Nothing else is granted: the job
    # reads the repository, builds it, and publishes what it built.
    permissions:
      contents: write
    env:
      # Whether a certificate exists at all. The `secrets` context cannot be
      # read from a step's `if`, but `env` can, so the question is answered once
      # here and asked by name below.
      SIGNABLE: ${{ secrets.MAC_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: The web app, and the logic the launchers share
        run: |
          npm ci
          npm test
          npm run build

      # Pinned by desktop/forgefx.lock.json: a tag to read, a commit to fetch.
      # FORGEFX_TOKEN is required — the mirrors it reads are private. Without it
      # the script stops and says so by name rather than failing on git's own
      # "could not read Username", which sends people looking anywhere but here.
      - name: Vendor the device server
        env:
          FORGEFX_TOKEN: ${{ secrets.FORGEFX_TOKEN }}
        run: npm run vendor:forgefx

      - name: Install the shell
        working-directory: desktop
        run: npm install

      # The question this answers cannot be answered anywhere but here: the
      # server's native modules are built against system Node, and the app runs
      # them under Electron-as-Node, whose ABI differs. N-API modules do not
      # care; anything else does, and the symptom would be an app that opens
      # perfectly and never sees the unit. Better a red build than that.
      - name: The native modules load under Electron
        working-directory: desktop/vendor/forgefx/server
        run: |
          ELECTRON="$(cd "$GITHUB_WORKSPACE/desktop" && node -p 'require("electron")')"
          echo "electron: $ELECTRON"
          ELECTRON_RUN_AS_NODE=1 "$ELECTRON" -e "
            require('serialport');
            require('@julusian/midi');
            console.log('serial and MIDI both load under Electron-as-Node');
          "

      # Two steps rather than one, and the reason is worth writing down.
      #
      # electron-builder decides whether to sign from whether CSC_LINK is
      # *defined*: `getCscLink` is commented "allow to specify as empty string",
      # and the gate is `cscLink == null`. GitHub turns a secret that does not
      # exist into an empty string — which is not null — so naming the secret in
      # `env:` says "sign, with this empty certificate", and the build dies with
      # "<dir> not a file". A pull request hides it, because electron-builder
      # refuses to sign PR builds at all; every other trigger hits it.
      #
      # An `env:` block cannot leave a variable unset, so the choice has to be
      # which step runs.
      - name: Package
        if: ${{ github.event_name == 'pull_request' || env.SIGNABLE != 'true' }}
        working-directory: desktop
        env:
          # Nothing to sign with, and say so rather than letting it look.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Package, signed and notarised
        if: ${{ github.event_name != 'pull_request' && env.SIGNABLE == 'true' }}
        working-directory: desktop
        env:
          # Published only from a release tag. Every other run builds the same
          # artefact and keeps it, so a dispatch can prove the signing chain
          # without putting a version on the update feed that nobody asked for.
          # Two ways to say "release this", and one of them is a button.
          #
          # A tag was the only way, and pushing one is not always available —
          # a credential scoped to a branch is refused with a 403, and there is
          # nothing to retry. It was never required either: electron-builder
          # creates the release through GitHub's API and GitHub makes the tag,
          # so the tag is a *result* of releasing rather than the trigger for
          # it. The run that publishes is the record of what was released.
          #
          # Only ever from the default branch. `createRelease` does not send a
          # commit to tag, so GitHub tags the default branch's head — a release
          # published from anywhere else would carry that name and someone
          # else's code.
          PUBLISH: >-
            ${{ (startsWith(github.ref, 'refs/tags/desktop-v')
                 || (inputs.publish && github.ref == 'refs/heads/main'))
                && 'always' || 'never' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist

      # electron-builder notarises the app and stops there. Its
      # `notarizeIfProvided` takes the app path, and it runs during signing —
      # before a disk image exists at all. So the .dmg a person actually
      # downloads carried no ticket of its own, which is exactly what the step
      # below caught the first time it got far enough to ask:
      # "does not have a ticket stapled to it".
      #
      # That matters because the image is the first thing macOS assesses. It
      # quarantines the download and checks the container before anything
      # inside it is reachable, and a stapled ticket is what lets that succeed
      # with no network.
      #
      # Deliberately not signed. electron-builder offers `dmg.sign` and
      # documents it as "Signing is not required and will lead to unwanted
      # errors in combination with notarization requirements" — the notary
      # service reads what is inside the image, and the ticket attaches either
      # way. Taking the tool's own word over a guess.
      - name: Notarise the disk image too
        if: ${{ github.event_name != 'pull_request' && env.SIGNABLE == 'true' }}
        working-directory: desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dmg in release/*.dmg; do
            echo "── $dmg"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$dmg"
          done

      # What the steps above claim, checked against what macOS will actually do
      # with the file. Three different questions, and a build can pass one while
      # failing another:
      #
      #   codesign --verify   is the signature intact, and does it cover
      #                       everything inside — the vendored server's native
      #                       modules included
      #   spctl --assess      would Gatekeeper let a person open this
      #   stapler validate    did notarisation actually happen, and is the
      #                       ticket attached so it works with no network
      #
      # The last one is why this step exists rather than a comment guessing at
      # whether electron-builder notarises on the strength of credentials alone.
      # If it does not, this goes red and names the missing piece, which beats
      # shipping a .dmg that Gatekeeper quarantines on someone else's Mac.
      - name: Prove the artefact is what it claims
        if: ${{ github.event_name != 'pull_request' && env.SIGNABLE == 'true' }}
        working-directory: desktop
        run: |
          set -euo pipefail
          # Globs rather than `find | for`: the product name has spaces in it.
          shopt -s nullglob

          seen=0
          for app in release/mac*/*.app; do
            seen=1
            echo "── $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type exec --verbose=4 "$app"
            xcrun stapler validate "$app"
          done
          [ "$seen" = 1 ] || { echo "no .app was produced to check"; exit 1; }

          # The disk image gets one question, not the app's three. `codesign
          # --verify` was asked of it once and cannot ever pass: a .dmg is a
          # disk image, not a code object, and the first build to reach this
          # said so — "code object is not signed at all" — while the app inside
          # it had already come back "accepted, source=Notarized Developer ID".
          #
          # What matters for a file someone downloads is the stapled ticket:
          # macOS quarantines the download and checks the image itself before
          # anything inside it is reachable, and a stapled ticket is what makes
          # that work with no network.
          seen=0
          for dmg in release/*.dmg; do
            seen=1
            echo "── $dmg"
            xcrun stapler validate "$dmg"
          done
          [ "$seen" = 1 ] || { echo "no .dmg was produced to check"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: fractal-ai-builder-mac
          path: desktop/release/*.dmg
          if-no-files-found: error
