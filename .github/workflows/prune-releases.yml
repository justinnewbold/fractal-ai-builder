# Clear out the old releases, once, by hand.
#
# "Can we remove the old releases from GitHub as it's confusing that the 7+
# versions are at the top? So let's just remove them all and start over fresh
# with the 1.0 and 1.01 there."
#
# 140 releases, 136 of them from before the renumber. The version reset from
# 7.397.0 to 1.0.0 means every old build reads as NEWER than every current one
# to anybody scanning the page, which is the whole complaint: the first thing
# on the Releases page is a version that no longer exists.
#
# WHY THIS IS A WORKFLOW RATHER THAN A SCRIPT SOMEBODY RUNS. Deleting a release
# cannot be undone, and there is no dry run in the GitHub UI. So this exists to
# be read before it is run: the keep list is an input with a sane default, the
# confirmation is a word that has to be typed, and every decision is printed
# before anything is deleted.
#
# It also only ever runs when somebody asks. There is no push trigger and there
# will not be one.
name: prune releases

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to confirm. Anything else stops.'
        required: true
        default: ''
      keep:
        description: 'Tags to keep, comma separated'
        required: true
        default: 'v1.0.0,v1.0.1,apk-v1.0.0,apk-v1.0.1'
      also_tags:
        description: 'Delete the git tag as well, not just the release'
        type: boolean
        default: false
      dry_run:
        description: 'List what would go, delete nothing'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      # Before anything is listed, let alone deleted.
      - name: The word was typed
        run: |
          if [ "${{ inputs.confirm }}" != "DELETE" ]; then
            echo "::error::Confirmation was '${{ inputs.confirm }}'. Type DELETE exactly, or leave it alone."
            exit 1
          fi

      - uses: actions/checkout@v4

      # Every release, not the first page of them. 140 is more than one page
      # and a partial list would silently leave half the mess behind.
      - name: What is here, and what would go
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ inputs.keep }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json tagName,isDraft,createdAt > all.json
          node -e '
            const fs = require("fs")
            const all = JSON.parse(fs.readFileSync("all.json", "utf8"))
            const keep = new Set(process.env.KEEP.split(",").map((s) => s.trim()).filter(Boolean))
            const go = all.filter((r) => !keep.has(r.tagName))
            const kept = all.filter((r) => keep.has(r.tagName))
            console.log(`releases found : ${all.length}`)
            console.log(`keeping        : ${kept.map((r) => r.tagName).join(", ") || "(none — check the keep list!)"}`)
            console.log(`deleting       : ${go.length}`)
            for (const r of go) console.log(`   ${r.tagName}${r.isDraft ? "  (draft)" : ""}`)
            fs.writeFileSync("go.txt", go.map((r) => r.tagName).join("\n"))
            /* A keep list that matches nothing is a typo, and a typo here
               deletes everything. */
            if (!kept.length) {
              console.error("::error::The keep list matched no release. Refusing to delete all 140.")
              process.exit(1)
            }
          '

      - name: Delete them
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          ok=0; failed=0
          while read -r tag; do
            [ -z "$tag" ] && continue
            if gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes \
                 ${{ inputs.also_tags && '--cleanup-tag' || '' }}; then
              ok=$((ok + 1))
            else
              echo "::warning::could not delete $tag"
              failed=$((failed + 1))
            fi
          done < go.txt
          echo "deleted $ok · failed $failed"
          echo "### Pruned $ok releases" >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -gt 0 ] && echo "$failed could not be deleted." >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: What a dry run would have done
        if: ${{ inputs.dry_run }}
        run: |
          echo "### Dry run — nothing was deleted" >> "$GITHUB_STEP_SUMMARY"
          echo "Run again with **Dry run** unticked to actually delete." >> "$GITHUB_STEP_SUMMARY"
