# An Android APK you can put on the phone yourself, from a link on GitHub.
#
# WHY THIS EXISTS BESIDE mobile.yml, which can already build for Android.
#
# "Android I would prefer to download directly since it will let me install it
# directly to the phone. Can you just give me a GitHub link for the android to
# download?" An EAS build finishes on Expo's servers behind a sign-in, and the
# `production` profile makes an .aab — a bundle for the Play Store, which a
# phone cannot install at all. This makes the thing a phone CAN install and
# leaves it on a Releases page, where the link is a link and tapping it on the
# handset is the whole of the install.
#
# It also costs nothing that runs out. EAS build slots are a limited, spendable
# thing on the free plan and the iOS ones are the reason every build in this
# repository is asked for rather than automatic. This one is an ordinary
# ubuntu-latest runner compiling an Android project — there is no queue and no
# quota, so it is safe to run whenever there is something worth installing.
#
# HOW IT IS SIGNED, which is the part that bites later rather than now.
#
# Android will not install an unsigned APK, and it will not UPGRADE an app
# whose signature changed — the second install fails with a conflict and the
# only way past it is to uninstall first, which takes the app's data with it.
# So the key has to be the same every time.
#
# `expo prebuild` writes the React Native template's debug keystore into
# android/app, byte for byte the same on every run, and the template's release
# build is configured to use it. That is the standard arrangement for an app
# that is sideloaded rather than published, and it is what makes one of these
# APKs install over the last one. It is NOT good enough for the Play Store, and
# nothing here sends it there.
name: apk

on:
  workflow_dispatch:
  # And on a version bump that lands on main, because an APK is only useful if
  # it is the current app. The version job in web.yml already insists every
  # change carries a new one, so this is one APK per merged change.
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'shared/**'
      - 'package.json'
      - '.github/workflows/apk.yml'

# The Release is written from here, so the token needs to be able to write it.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # A HANG HERE USED TO COST SIX HOURS AND SAY NOTHING.
    #
    # Every APK build from 7.325.0 to 7.352.0 ran out of Metaspace, printed
    # `java.lang.OutOfMemoryError: Metaspace` a few dozen times, and then sat
    # there. The last error in the log was at 20:51 and GitHub killed the job
    # at 01:30 — four and a half hours of nothing, ending in `cancelled`
    # rather than `failure`, which reads like somebody pressed a button.
    #
    # Nine releases went by with no Android build and nothing said so. A
    # ceiling makes the next one a red X in forty minutes.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Java 17 rather than whatever the runner defaults to. The Android
      # Gradle Plugin the current Expo template uses refuses anything older,
      # and the failure it gives is a stack trace about an unsupported class
      # file version rather than a sentence about Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: What version this is
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install the app's own dependencies
        working-directory: mobile
        run: npm ci

      # The android/ directory is not in the repository — this app is managed
      # by Expo and the native project is generated from app.json. Generating
      # it here rather than committing it means the icon, the package name and
      # the plugins are always the ones app.json says, and nothing can drift.
      - name: Make the native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      # AND THE TWO THINGS EAS WOULD HAVE PUT IN, WITHOUT WHICH THIS APK CAN
      # NEVER TAKE AN UPDATE.
      #
      # "The android app is still on 3.171. It's supposed to be doing updates,
      # right?" It was supposed to, and it could not, and nothing said so —
      # the app asked Expo for an update on every launch and was never going
      # to be given one.
      #
      # `expo prebuild` writes the updates URL into the manifest and stops
      # there, because the rest is normally EAS Build's job. Two pieces were
      # therefore missing from every APK this workflow has ever produced:
      #
      #   THE RUNTIME VERSION. app.json sets `runtimeVersion.policy` to
      #   `fingerprint`, and prebuild renders that as the literal string
      #   `file:fingerprint` — a sentinel telling expo-updates to read the
      #   real hash out of an asset named `fingerprint`. Nothing in a bare
      #   gradle build writes that asset, so the read threw and the whole
      #   updates configuration was invalid. Written without a trailing
      #   newline on purpose: it is compared to the published runtime version
      #   as a whole string, and "…de12\n" is not "…de12".
      #
      #   THE CHANNEL. An update is published to a branch, and an app says
      #   which branch it wants with an `expo-channel-name` request header.
      #   EAS injects it from the profile in eas.json. A sideloaded APK had
      #   none, so even a correct fingerprint would have asked the server a
      #   question with no answer. `preview` is the one to ask for: it is the
      #   eas.json profile for a directly-installed build, which is what this
      #   is.
      #
      # BOTH ARE WRITTEN HERE RATHER THAN IN app.json, for the reason the
      # memory settings are — see the note below. app.json is hashed into the
      # runtime fingerprint, so putting either of these there would move the
      # number and cut off every installed copy of the app to fix the thing
      # that stops installed copies being cut off.
      - name: Make it able to take updates
        id: fp
        working-directory: mobile
        run: |
          set -euo pipefail
          hash="$(node -p "require('./fingerprint.json').android")"
          [ -n "$hash" ] || { echo "::error::No android fingerprint recorded."; exit 1; }
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          mkdir -p android/app/src/main/assets
          printf '%s' "$hash" > android/app/src/main/assets/fingerprint
          python3 - "$hash" <<'PY'
          import sys
          key = 'expo.modules.updates.UPDATES_CONFIGURATION_REQUEST_HEADERS_KEY'
          at = 'android/app/src/main/AndroidManifest.xml'
          s = open(at).read()
          if key in s:
              raise SystemExit('the channel is already set — prebuild now does this, so this step can go')
          anchor = '<meta-data android:name="expo.modules.updates.EXPO_UPDATE_URL"'
          if anchor not in s:
              raise SystemExit('no updates URL in the manifest — updates are off, so the channel would mean nothing')
          row = '<meta-data android:name="%s" android:value="{&quot;expo-channel-name&quot;:&quot;preview&quot;}"/>\n    ' % key
          open(at, 'w').write(s.replace(anchor, row + anchor, 1))
          print('runtime version', sys.argv[1], 'and channel preview written in')
          PY
          grep -c 'expo-channel-name' android/app/src/main/AndroidManifest.xml

      # HALF THIS APK WAS NATIVE CODE NO PHONE CAN RUN.
      #
      # "It keeps hanging when it says it's all the way downloaded." The file
      # was 99.6 MB, and a download that large over a handset's connection is
      # the kind of thing a phone browser gives up on at the last step.
      #
      # Opened up, it carried FOUR copies of every native library — one per
      # processor the Android toolchain knows about:
      #
      #   lib/x86           22.7 MB   emulators on a desktop, never a phone
      #   lib/x86_64        21.9 MB   the same
      #   lib/armeabi-v7a   14.0 MB   32-bit ARM, gone from phones years ago
      #   lib/arm64-v8a     20.5 MB   every Android phone made this decade
      #
      # Nearly 59 MB of a 99.6 MB download that the handset it was aimed at
      # would never load. Not this app's own code either: the biggest single
      # file in the x86 pile is Google's barcode scanner, shipped prebuilt for
      # all four and packaged for all four.
      #
      # `reactNativeArchitectures` is the lever. The React Native gradle plugin
      # turns it into AGP's `ndk.abiFilters`, which filters every native
      # library packaged into the APK — the ones from third-party AARs
      # included, which is what makes it worth more than it looks.
      #
      # WHICH LEAVES arm64-v8a, and what that costs: an APK that will not
      # install on a 32-bit-only Android device. Google Play has required
      # 64-bit since 2019 and every phone worth driving a rig from is arm64,
      # so this is a line to change back rather than a bridge to burn — and
      # the page that hands out the link says what it is for.
      #
      # 99.6 MB -> about 41 MB.
      #
      # HERE RATHER THAN IN app.json, for the same reason as the memory
      # settings below. app.json is hashed into the runtime fingerprint, and
      # moving that number cuts off every installed copy of the app from
      # updates.
      - name: Only the processor a phone actually has
        working-directory: mobile/android
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' gradle.properties
          grep reactNativeArchitectures gradle.properties

      # THE TEMPLATE'S MEMORY CEILING IS NO LONGER ENOUGH FOR THIS APP.
      #
      # `expo prebuild` writes the React Native template's gradle.properties,
      # which has said this since long before this project existed:
      #
      #   org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
      #
      # Metaspace holds class metadata, and it is the 512m that ran out —
      # around twenty Expo modules plus React Native plus Kotlin is simply
      # more classes than that. Not heap: the log says Metaspace by name.
      #
      # RAISED HERE RATHER THAN IN app.json, which is the part worth being
      # deliberate about. The same numbers can be set with the
      # expo-build-properties plugin, and that would put them in the app
      # config — which is hashed into the runtime fingerprint, so every
      # installed copy of the app would stop being able to take updates. A
      # build-server memory setting is not something the binary cares about,
      # so it does not belong anywhere the binary is identified by.
      #
      # android/ is generated and gitignored, so this edits a file that only
      # exists for the next two minutes.
      - name: Give the build enough memory to finish
        working-directory: mobile/android
        run: |
          sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8/' gradle.properties
          printf '\n# Raised by .github/workflows/apk.yml — see the note there.\nkotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m\n' >> gradle.properties
          grep jvmargs gradle.properties

      # AND THE RUNTIME VERSION HAS TO SURVIVE THE BUILD, which it did not.
      #
      # "The Android app is still on 7.391.0." It was, and it always would
      # have been: not one APK this workflow has ever produced could take an
      # update, including the ones built after the step above was added to
      # make exactly that work.
      #
      # `expo-updates` WRITES THAT ASSET ITSELF, during the gradle build, in
      # createFingerprintForBuildAsync — and it recomputes the fingerprint
      # rather than reading the one already sitting there. So the step above
      # writes the right hash and gradle then overwrites it.
      #
      # What it computes is different, and it is different for a reason that
      # is its own fault. The fingerprint hashes, among other things, the
      # directory `node_modules/expo-updates/expo-updates-gradle-plugin` — and
      # by the time gradle asks the question, gradle has compiled that plugin
      # and left its build output inside that very directory. Building the app
      # changes the number that identifies the app. Every APK therefore got a
      # runtime version of its own:
      #
      #   published updates ask for   826b1b536206f9405d315fdfa1761986b60ade12
      #   the 7.391.0 APK answered    35dd3dda164fc94d542d3d170cca62078137936b
      #   the next APK answered       b39d9d5a517bb773d5350ba31508878a1fd68059
      #
      # A phone whose runtime version matches nothing is handed nothing, for
      # ever, and is told nothing about it. That is the whole of why a handset
      # sat on the version it was installed at while thirty changes went past.
      #
      # EXPO_UPDATES_FINGERPRINT_OVERRIDE is the supported way to say it: the
      # same function checks it first and skips the recompute entirely. The
      # value is the one `eas update` publishes under, straight out of
      # fingerprint.json, so the two cannot drift.
      - name: Build it
        working-directory: mobile/android
        env:
          EXPO_UPDATES_FINGERPRINT_OVERRIDE: ${{ steps.fp.outputs.hash }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      # Proof rather than hope: read the runtime version back out of the APK
      # that was actually built and hold it to the one updates go to. A silent
      # mismatch here is invisible until a phone is sitting in front of you on
      # last week's version.
      - name: The APK asks for the updates that exist
        working-directory: mobile
        run: |
          set -euo pipefail
          want="$(node -p "require('./fingerprint.json').android")"
          got="$(unzip -p android/app/build/outputs/apk/release/app-release.apk assets/fingerprint)"
          echo "published under: $want"
          echo "the APK asks for: $got"
          [ "$want" = "$got" ] || {
            echo "::error::This APK would never receive an update. Built $got, updates go to $want."
            exit 1
          }

      - name: Name it after the version
        id: apk
        run: |
          set -e
          built=mobile/android/app/build/outputs/apk/release/app-release.apk
          out="fractal-remote-v${{ steps.v.outputs.version }}.apk"
          mv "$built" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      # Two ways out, because they are for different people. The artifact is
      # here for a run you are already looking at; the Release is the link that
      # can be sent to a phone and tapped.
      - uses: actions/upload-artifact@v4
        with:
          name: fractal-remote-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Put it on the Releases page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: apk-v${{ steps.v.outputs.version }}
        run: |
          set -e
          # Re-runnable on purpose: a build repeated for the same version
          # replaces the file rather than failing on a tag that exists.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Fractal Remote v${{ steps.v.outputs.version }} (Android)" \
              --notes "Android APK for Fractal Remote v${{ steps.v.outputs.version }}. Download it on the phone and open it; Android will ask once whether this browser may install apps. It installs over an earlier one of these without removing anything." \
              --latest=false
          fi
          # The upload is tried again before it is called a failure. Three
          # runs in one evening built fine and died here on GitHub's own
          # "HTTP 500: Error saving asset" — a 70 MB file to an upload
          # service having a moment — and each one sent a "Run failed" to a
          # phone, for a release that was created and merely empty.
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --clobber; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "The upload failed five times; the file is still in this run's artifacts." >&2
              exit 1
            fi
            echo "Upload attempt $attempt failed; trying again in 30s."
            sleep 30
          done
          echo "### Install it" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/download/${TAG}/${{ steps.apk.outputs.path }}" >> "$GITHUB_STEP_SUMMARY"
