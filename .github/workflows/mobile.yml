# Check and build the phone apps.
#
# Two jobs, because they answer different questions and only one of them needs
# a secret.
#
# `check` runs on every pull request that touches the app and needs nothing at
# all. It bundles for both platforms with Metro, which is the only thing that
# catches the failures this app is actually prone to: an import Metro cannot
# resolve, a package the installed SDK does not match, a screen that references
# something that no longer exists. None of that shows up in `npm test`, and all
# of it shows up minutes into an EAS build otherwise — on a build machine, at
# the far end of a queue.
#
# `build` is started by hand and produces something installable. It needs
# EXPO_SECRET, an Expo access token with build permission, in the repository
# secrets. Without it the job says so and stops rather than failing halfway
# through with an authentication error that reads like a code problem.
#
# EXPO_SECRET rather than the conventional EXPO_TOKEN, and the reason is worth
# a line: that is what the secret is called. The name was written here first
# and the secret was created second, under a different one, and the job then
# reported no token for a token that was sitting right there. Renaming a GitHub
# secret means deleting it and making a new one, and an Expo access token is
# shown exactly once — so insisting on the convention would have cost a trip
# back to expo.dev for a fresh token to fix a spelling. The file bends instead.
#
# It is passed to expo-github-action's `token:` input, which puts it in the
# environment as EXPO_TOKEN for every step after it, so the EAS CLI sees the
# name it expects regardless.
#
# There is no push-to-main build on purpose. An iOS build consumes a queue slot
# and, on a paid plan, money; a native build on every merge would spend both on
# changes that never touch the phone.
name: mobile

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which platform to build'
        type: choice
        default: all
        options: [all, ios, android]
      profile:
        description: 'Which eas.json build profile'
        type: choice
        default: preview
        options: [preview, ios-simulator, production, development]
      submit:
        description: 'Send it to TestFlight / Play when it finishes'
        type: boolean
        default: false
      submit_only:
        description: 'Skip building; send the last build that succeeded'
        type: boolean
        default: false
      update:
        description: 'Publish a JS update instead of building (costs no build slot)'
        type: boolean
        default: false
      update_channel:
        description: 'Which channel the update goes to'
        type: choice
        default: both
        options: [both, production, preview]
  pull_request:
    paths:
      - 'mobile/**'
      - 'shared/**'
      - 'scripts/sync-relay-rules.mjs'
      - '.github/workflows/mobile.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The suite that holds the two clients in agreement — the relay rules,
      # the project both ends sign into, how an empty slot reads.
      - run: npm ci
      - name: The repository checks, phone apps included
        run: npm test

      - name: Install the app's own dependencies
        working-directory: mobile
        run: npm ci

      - name: The config is one the installed SDK understands
        working-directory: mobile
        run: npx expo-doctor

      # Both platforms, because they resolve differently: a module with a
      # `.ios.js` variant, or a native package missing on one side, bundles on
      # one and not the other.
      - name: It bundles for iOS
        working-directory: mobile
        run: npx expo export --platform ios --output-dir /tmp/bundle-ios

      - name: It bundles for Android
        working-directory: mobile
        run: npx expo export --platform android --output-dir /tmp/bundle-android

  build:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.update }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24 here and everywhere else in this repository, which it was not
      # always. This job ran ahead of the rest on 22 for a while, and the
      # reason is worth keeping because it is what eventually moved the whole
      # repository.
      #
      # eas-cli 24.6.0 will not install on Node 20 — one of its dependencies
      # refuses outright:
      #
      #   error @oclif/plugin-autocomplete@3.3.0: The engine "node" is
      #   incompatible with this module. Expected version ">=22.0.0".
      #   Got "20.20.2"
      #
      # That was one of the two triggers the repository had been watching for,
      # and it fired: something needed would not install on Node 20. This job
      # went to 22 alone because it compiles no native module and never runs
      # the unit — it installs a CLI and hands a directory to Expo's build
      # servers.
      #
      # The rest followed in 7.334.0, once the fear the watching brief was
      # written around had been measured rather than assumed. See CLAUDE.md:
      # serialport and @julusian/midi both declare N-API, which is ABI-stable
      # on purpose, and desktop.yml already proves they load under Electron on
      # every build.
      #
      # The Node the packaged Mac app runs is still NOT this one. That comes
      # from whatever Electron bundles, and Electron 33 bundles Node 20.18.
      # Moving it is a separate change with a hardware check at the end.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Never reads the `secrets` context as a whole, and that is the point.
      #
      # This step briefly did, to list the secret names when the token came
      # back empty — the idea being that a typo, the Variables tab, an
      # environment secret and the wrong repository all look identical from
      # here, and the names would tell them apart. It worked exactly as well as
      # a credential dump: serialising the whole secrets context is a
      # documented exfiltration technique, and every run of this workflow was
      # held at action_required from the moment it landed — the one triggered
      # by hand from the Actions tab included. web.yml on the same commit ran
      # untouched, which is what pinned it to this file.
      #
      # The names are not worth that. A person looking at the repository's
      # Secrets page reads them in one glance, with nothing written to a log
      # that anyone with read access can then fetch. So the step asks its one
      # question, says where to go, and touches nothing else.
      - name: There is a token to build with
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_SECRET }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::No EXPO_SECRET secret. Add an Expo access token with build permission at Settings › Secrets and variables › Actions, on the Secrets tab, named exactly EXPO_SECRET. Check the name against that page: Variables is a separate tab, and an environment secret is not a repository secret."
            exit 1
          fi

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_SECRET }}

      - name: Install the app's own dependencies
        working-directory: mobile
        run: npm ci

      # The app has to exist on Expo's side before anything can be built for
      # it, and until now it never has: app.json carried an empty `extra.eas`,
      # so there was no project id and `eas build --non-interactive` has
      # nothing to attach a build to.
      #
      # `eas init` is what creates it, and it is safe to run every time: with
      # the owner and slug set in app.json it finds the existing project on
      # every run after the first and writes the same id back. Nothing is
      # created twice.
      #
      # The id it writes lands in the runner's copy of app.json and is thrown
      # away with the runner. That is untidy but not wrong — the owner and the
      # slug are what identify the project, and they are committed. Pinning the
      # id in app.json once it is known would save this call; it is not worth a
      # round trip to find out.
      - name: The app is registered with Expo
        working-directory: mobile
        run: eas init --non-interactive --force

      # Non-interactive and queued rather than waited on: an iOS build can sit
      # in a queue longer than a job is allowed to run, and a workflow that
      # times out waiting looks like a build that failed.
      # The Apple login this repository already has.
      #
      # An iOS build needs a Distribution Certificate, and Expo will not
      # conjure one on its own:
      #
      #   Distribution Certificate is not validated for non-interactive builds.
      #   Credentials are not set up. Run this command again in interactive mode.
      #
      # Creating one means asking Apple, and asking Apple means logging in.
      # These two secrets are that login, and they have been in this repository
      # for weeks doing the Mac app's notarising in desktop.yml — the same
      # Apple ID, the same app-specific password. Nothing new was needed; they
      # were simply never handed to this job.
      #
      # EXPO_APPLE_ID and EXPO_APPLE_APP_SPECIFIC_PASSWORD are the names the
      # EAS CLI looks for. An app-specific password rather than the account
      # password is the whole point: it carries no two-factor prompt, which is
      # what a build server cannot answer.
      # Building and shipping are two different things, and the gap between
      # them is easy to miss: `eas build` produces a file on Expo's servers
      # and stops there. Nothing reaches TestFlight, so nothing is installable
      # on a phone, and the build page looks finished while the phone stays
      # empty.
      #
      # `--auto-submit` closes that gap without waiting: the build is queued
      # with `--no-wait` because an iOS build can outlast a job, and the
      # submission is queued behind it on Expo's side rather than here. It
      # needs the App Store Connect API key, which is on the project now, and
      # eas.json's submit block already names the team.
      #
      # Off by default. A submission is outward-facing — it puts a build in
      # front of Apple's review tooling and every TestFlight tester — so it is
      # asked for by ticking the box, not a side effect of building.
      # Sends the build that already exists, rather than making another.
      #
      # A submission can fail on its own — a missing App Store Connect app id,
      # a name Apple would not accept — while the build it was carrying is
      # perfectly good and sitting on Expo's servers. Rebuilding to retry the
      # submission costs twenty-five minutes to produce a byte-identical
      # artefact, and burns a build slot doing it.
      #
      # `--latest` is the newest finished build for the platform, which is
      # exactly the one the failed submission was for.
      - name: Send the last build
        if: ${{ inputs.submit_only }}
        working-directory: mobile
        run: |
          eas submit \
            --platform "${{ inputs.platform }}" \
            --profile "${{ inputs.profile }}" \
            --latest \
            --non-interactive

      - name: Build
        if: ${{ !inputs.submit_only }}
        working-directory: mobile
        env:
          EXPO_APPLE_ID: ${{ secrets.APPLE_ID }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          eas build \
            --platform "${{ inputs.platform }}" \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --no-wait \
            ${{ inputs.submit && '--auto-submit' || '' }}

  # ---------------------------------------------------------------- updating
  #
  # PUBLISHING A JS UPDATE, WHICH COSTS NOTHING.
  #
  # This existed nowhere until now, which was a real gap rather than an
  # oversight worth shrugging at: every change since the last build has been
  # JavaScript, and there was no way to get any of it onto a phone short of
  # spending one of a handful of iOS build slots. `eas update` sends the
  # bundle to Expo and the installed app picks it up on its next launch.
  #
  # WHY IT CANNOT SHIP THE WRONG THING TO THE WRONG BUILD. app.json sets
  # `runtimeVersion.policy` to `fingerprint`: Expo hashes everything native —
  # the config, the native dependency graph, the autolinked modules — and an
  # update only reaches a build whose fingerprint matches. Change a native
  # dependency and the hash moves, and older builds simply never see it rather
  # than downloading something they cannot run. So this is safe to run on a
  # whim in a way that a build is not.
  #
  # BOTH CHANNELS BY DEFAULT, because which one an installed app listens to is
  # decided by the profile it was built with — `production` for anything that
  # went to TestFlight, `preview` for anything installed directly — and the
  # person asking for an update should not have to remember which. The same
  # bundle going to both is harmless; a bundle going to the one channel the
  # phone in your hand is not on is a confusing half hour.
  update:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The same one question the build job asks, for the same reason, and
      # deliberately without reading the `secrets` context as a whole — see
      # the long note on that step above.
      - name: There is a token to publish with
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_SECRET }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::No EXPO_SECRET secret. Add an Expo access token at Settings › Secrets and variables › Actions, on the Secrets tab, named exactly EXPO_SECRET."
            exit 1
          fi

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_SECRET }}

      # The generated copies the phone carries are built from shared/ at the
      # repository root, so the root install happens too. An update that
      # shipped a stale copy of the relay rules would be the exact drift
      # sync:rules exists to stop, published straight to a handset.
      - name: Install, and prove the generated copies are current
        run: |
          npm ci
          npm run sync:rules
          git diff --exit-code -- mobile/src/lib mobile/app.json \
            || { echo "::error::A generated copy under mobile/ is stale. Run npm run sync:rules and commit it."; exit 1; }

      - name: Install the app's own dependencies
        working-directory: mobile
        run: npm ci

      # Branch rather than channel. A channel points at a branch, and every
      # channel here was created by a build with the same name as its branch,
      # so naming the branch reaches the same place and works on every version
      # of the CLI rather than only the ones that accept `--channel`.
      - name: Publish
        working-directory: mobile
        run: |
          set -euo pipefail
          want="${{ inputs.update_channel }}"
          [ "$want" = "both" ] && targets="production preview" || targets="$want"
          for branch in $targets; do
            echo "── $branch ──"
            eas update \
              --branch "$branch" \
              --message "${GITHUB_REF_NAME}@$(git rev-parse --short HEAD): $(git log -1 --pretty=%s | cut -c1-80)" \
              --non-interactive
          done

      - name: What was published
        run: |
          echo "Published to: ${{ inputs.update_channel }}"
          echo "An installed app picks this up on its next launch, if its fingerprint matches the build."
