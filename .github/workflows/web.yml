# Check every change before it is merged.
#
# Until now `desktop.yml` was the only workflow, and it runs the test suite only
# when `desktop/**` changes — so every change to the app itself merged with
# nothing checking it. That was survivable while the tests were run by hand
# before each push, and stops being survivable the moment a build artifact is
# something a person downloads and installs.
#
# The version job is the standing rule — every change gets a new version — made
# mechanical. It is separate from the tests because it answers a different
# question: not "does this work" but "can this be told apart from what came
# before", which is what an installed app comparing itself to a release needs.
name: web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit, structure, styles, touch and limits
        run: npm test
      - name: The app builds
        run: npm run build

  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Against the commit this pull request was based on, not against the base
      # branch as it stands when the job runs. Pull requests here are merged
      # within seconds of being pushed, so by the time this ran the base branch
      # already carried the new version and the job said "still 7.117.0" about
      # a change that had moved it — a red mark on every push, none of them
      # true. "I keep getting a failed notification from GitHub every time you
      # push." The base SHA is fixed at the moment of the push and cannot be
      # overtaken by the merge.
      - name: The version moved
        env:
          BASE: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          before=$(git show "$BASE_SHA":package.json | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          now=$(node -pe "require('./package.json').version")
          echo "$BASE was $before at ${BASE_SHA:0:7}; this branch is $now"
          if [ "$before" = "$now" ]; then
            echo "::error file=package.json::Still $now. Every change gets a new version."
            exit 1
          fi
